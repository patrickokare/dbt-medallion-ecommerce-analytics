version: 2

sources:
  - name: landing
    description: Raw e-commerce extracts loaded by the ingestion job. The catalog comes from the profile.
    schema: landing
    config:
      meta:
        # Only used by the DuckDB "ci" target: read the sample CSVs instead of real tables
        external_location: "data/sample/{name}.csv"
      freshness:
        warn_after: { count: 1, period: day }
        error_after: { count: 3, period: day }
      loaded_at_field: created_at
    tables:
      - name: orders
        columns:
          - name: id
            data_tests: [unique, not_null]
          - name: quantity
            data_tests: [assert_non_negative]
          - name: unit_price
            data_tests: [assert_non_negative]

      - name: products
        columns:
          - name: id
            data_tests: [unique, not_null]

      - name: reviews
        columns:
          - name: id
            data_tests: [unique, not_null]

      - name: users
        columns:
          - name: id
            data_tests: [unique, not_null]
